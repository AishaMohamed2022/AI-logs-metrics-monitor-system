# =============================================================================
# 05-backend-deployment.yaml
# Deployment -> ReplicaSet -> Pods (never create bare Pods).
#
# Contains:
#   * startup / liveness / readiness probes
#   * resource requests + limits (required by the HPA for utilization %)
#   * node affinity, tolerations, pod anti-affinity, topology spread
#   * rolling update strategy, graceful shutdown, non-root security context
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-backend
  namespace: dev
  labels:
    app.kubernetes.io/name: aiops-backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: aiops-platform
spec:
  replicas: 3
  revisionHistoryLimit: 3
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: aiops-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aiops-backend
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: aiops-platform
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      # ---------------- Scheduling rule 1: node affinity ----------------
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/os
                    operator: In
                    values: ["linux"]
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
            - weight: 50
              preference:
                matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values: ["amd64", "arm64"]

        # ---------------- Scheduling rule 2: pod anti-affinity ----------
        # Spread replicas over different nodes (best effort on 1-node clusters)
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values: ["aiops-backend"]
                topologyKey: kubernetes.io/hostname

      # ---------------- Scheduling rule 3: tolerations ------------------
      # Harmless when no node carries the taint; required if an admin labels
      # a node: kubectl label node <node> dedicated=aiops
      #         kubectl taint node <node> dedicated=aiops:NoSchedule
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "aiops"
          effect: "NoSchedule"
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"

      # ---------------- Scheduling rule 4: topology spread -------------
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: aiops-backend
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: aiops-backend

      containers:
        - name: backend
          image: aiops-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          envFrom:
            - configMapRef:
                name: backend-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: aiops-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: aiops-secrets
                  key: REDIS_URL

          # -------- Resource requests + limits (HPA math needs requests) --------
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          # -------- Startup probe: up to 5s x 30 = 150s for slow boot -------
          startupProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
            successThreshold: 1

          # -------- Liveness probe: restart only when truly wedged ----------
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1

          # -------- Readiness probe: gates traffic on DB + Redis health -----
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1

          # -------- Graceful shutdown: let endpoints drain before SIGTERM ---
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 8"]

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
