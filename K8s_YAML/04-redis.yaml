# =============================================================================
# 04-redis.yaml
# Redis 7 cache tier for the dev namespace: Deployment -> ClusterIP Service
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-redis
  namespace: dev
  labels:
    app.kubernetes.io/name: aiops-redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: aiops-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aiops-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aiops-redis
        app.kubernetes.io/component: cache
        app.kubernetes.io/part-of: aiops-platform
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/os
                    operator: In
                    values: ["linux"]
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "aiops"
          effect: "NoSchedule"
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: aiops-redis
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: redis
              containerPort: 6379
          command: ["redis-server", "--appendonly", "yes"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          startupProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 20
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: aiops-redis
  namespace: dev
  labels:
    app.kubernetes.io/name: aiops-redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: aiops-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: aiops-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
