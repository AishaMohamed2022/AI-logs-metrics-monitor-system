# =============================================================================
# 06-backend-service.yaml
# ClusterIP Service: stable virtual IP + DNS name (aiops-backend.dev.svc.cluster.local)
# and round-robin load balancing across all healthy backend pods.
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: aiops-backend
  namespace: dev
  labels:
    app.kubernetes.io/name: aiops-backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: aiops-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: aiops-backend
  sessionAffinity: None
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: http
